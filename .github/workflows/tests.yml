name: tests

on:
  push:
  pull_request:

jobs:
  rules:
    name: Game rules and save format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No dependencies and no build step: the game is plain files, and the
      # suite is the thing that would have caught the save bug.
      - run: node --test game/tests/*.test.cjs
