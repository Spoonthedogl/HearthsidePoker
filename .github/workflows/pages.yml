name: Deploy web game to GitHub Pages

# Publishes the browser version of the game so it can be played on any phone or
# computer, and installed to an iPhone/iPad home screen ("Add to Home Screen")
# or an Android home screen. Only the playable game ships — tests and tooling
# are left out. Runs after a push to master that touches the game.

on:
  push:
    branches: [master]
    paths:
      - 'game/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (game only, without tests or tooling)
        run: |
          mkdir -p _site
          cp -r game/. _site/
          rm -rf _site/tests _site/.claude
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
