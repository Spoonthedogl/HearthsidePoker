<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Hearthside scene checks</title><style>body{margin:0;background:#17120f;color:#e4d4af;font:14px Georgia}nav{height:46px;display:flex;align-items:center;gap:10px;padding:0 15px}button{padding:6px 16px;color:#3b3023;background:#e4c790;border:0;border-radius:4px}iframe{position:absolute;top:46px;left:0;width:100%;height:calc(100% - 46px);border:0}output{margin-left:auto}</style></head><body><nav><span>Scene preview</span><button data-pose="stretch">Cat stretch</button><button data-pose="groom">Cat grooming</button><button data-pose="watch">Cat watching window</button><output id="status">Ready</output></nav><iframe id="game" title="Hearthside game" src="../index.html"></iframe><script>
 document.querySelectorAll('[data-pose]').forEach(function(button){button.onclick=function(){var api=document.getElementById('game').contentWindow.hearth;if(api&&api.cat)api.cat.play(button.dataset.pose);};});
 setInterval(function(){var w=document.getElementById('game').contentWindow,api=w.hearth;if(api&&api.cat){var state=api.cat.getState();document.getElementById('status').textContent=state.action+' · frame '+state.frame;}},100);
 </script></body></html>
